<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE2">
<script>try{var p=JSON.parse(localStorage.getItem('minhas-notas-pref')||'{}'),t=p.tema||'auto',d=t==='escuro'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),e=document.documentElement;e.setAttribute('data-theme',d?'dark':'light');e.setAttribute('data-estilo',p.estilo||'caderno');if(/^#[0-9A-Fa-f]{6}$/.test(p.accent||'')){e.setAttribute('data-accent','1');e.style.setProperty('--accent-c',p.accent);}}catch(e){}</script>
<title>Minhas notas</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="auth" id="auth" hidden>
  <form class="authbox" id="authForm" novalidate>
    <img src="./icon-192.png" alt="" width="64" height="64" style="border-radius:16px">
    <h1 style="font-size:24px">Minhas notas</h1>
    <p class="muted" id="authMsg" style="margin:0;text-align:center;line-height:1.45">Entre com a sua conta para ver suas notas em qualquer aparelho.</p>
    <div class="field" style="width:100%" id="authEmailBox"><label for="authEmail">E-mail</label><input id="authEmail" type="email" autocomplete="email" required></div>
    <div class="field" style="width:100%" id="authPassBox"><label for="authPass" id="authPassLbl">Senha</label><input id="authPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <button type="submit" class="btn dark" id="authGo" style="width:100%">Entrar</button>
    <button type="button" class="btn" id="authToggle" style="width:100%">Criar conta</button>
    <button type="button" class="linkbtn" id="authForgot">Esqueci minha senha</button>
    <p class="muted" id="authErr" role="alert" style="margin:0;color:#A8231B;text-align:center"></p>
  </form>
</div>

<div class="shell">
<aside class="side" id="side" aria-label="Navegação">
  <div class="sbrand"><img src="./icon-192.png" alt="" width="32" height="32"><span>Minhas notas</span></div>
  <nav class="snav" aria-label="Telas">
    <button type="button" class="sbtn" data-sview="feed" aria-pressed="true"><span class="sic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span class="slab">Notas</span></button>
    <button type="button" class="sbtn" data-sview="cal" aria-pressed="false"><span class="sic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>Calendário</button>
    <button type="button" class="sbtn" data-sview="views" aria-pressed="false"><span class="sic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span><span class="slab">Resumo</span></button>
  </nav>
  <div class="ssearch"><label for="q2" class="sr">Buscar nas notas</label><input id="q2" type="search" placeholder="Buscar (Ctrl+K)"></div>
  <div id="sideLists" class="slists"></div>
  <div class="sfoot">
    <button type="button" class="sbtn" data-smenu="1"><span class="sic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="slab">Menu e configurações</span></button>
    <span class="muted" id="sideAcc" style="padding:0 10px;font-size:12px;word-break:break-all"></span>
  </div>
</aside>
<div class="app" id="app">
  <header class="top">
    <div class="row">
      <div class="seg navseg" style="--n:3" role="tablist" aria-label="Telas">
        <button type="button" role="tab" id="tabNotas" aria-selected="true" aria-pressed="true">Notas</button>
        <button type="button" role="tab" id="tabCal" aria-selected="false" aria-pressed="false">Calendário</button>
        <button type="button" role="tab" id="tabResumo" aria-selected="false" aria-pressed="false">Resumo</button>
      </div>
      <span style="flex:1 1 auto"></span>
      <button class="iconbtn" id="bFilter" type="button" aria-label="Filtrar por tipo ou marcador" aria-pressed="false" style="position:relative"></button>
      <button class="iconbtn" id="bSearch" type="button" aria-label="Buscar" aria-pressed="false"></button>
      <button class="iconbtn" id="bMenu" type="button" aria-label="Menu"></button>
    </div>
    <div id="searchWrap" hidden><label for="q" class="sr">Buscar nas notas</label><input id="q" class="search" type="search" placeholder="Buscar texto, pessoa, valor, marcador…"></div>
    <div class="activef" id="active" hidden></div>
    <div class="banner" id="banner" hidden></div>
  </header>
  <div class="pinbar" id="pinbar" hidden></div>
  <main class="feed" id="feed" aria-live="polite"></main>
  <section class="views" id="views" hidden></section>
  <div id="toastbar" class="toastbar" role="status" hidden></div>
  <div id="suggest"></div>
  <footer class="composer" id="composer">
    <button class="round" id="bPlus" type="button" aria-label="Escolher tipo de item"></button>
    <label class="round" id="lAttach" for="fAttach" aria-label="Anexar imagens, áudio ou documentos" style="cursor:pointer"></label>
    <input type="file" id="fAttach" class="sr" multiple accept="image/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.odt">
    <label for="msg" class="sr">Nova nota</label>
    <textarea id="msg" class="msg" rows="1" placeholder="Escreva ou cole uma nota…"></textarea>
    <button class="round dark" id="bSend" type="button" aria-label="Enviar nota"></button>
  </footer>
</div>
<aside class="aside" id="aside" aria-label="Resumo rápido"></aside>
</div>
<div id="layer"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
