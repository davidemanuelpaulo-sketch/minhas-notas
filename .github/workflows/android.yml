name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Montar a versão web
        run: npm run build

      - name: Gerar o projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Usar sempre a mesma assinatura (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Gerar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk minhas-notas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-notas-apk
          path: minhas-notas.apk

      - name: Publicar como "última versão"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao minhas-notas.apk \
            --title "Minhas notas — última versão (${{ github.run_number }})" \
            --notes "Toque em minhas-notas.apk para baixar e instalar no Android."
